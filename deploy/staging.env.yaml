# Environment for the STAGING deployment (separate chain, separate Firestore collections).
# Deployed as Cloud Run revision yaw-ledger-api-00002-cxj on 2026-10-04.
# The genesis account below is a throwaway test wallet whose key lived only in a temporary sandbox. Its tokens have no value.
# The real chain (yaw-testnet-1) gets its own genesis, which is a product decision, not made yet.
# Secrets (OPERATOR_PRIVATE_KEY, PRODUCER_TOKEN) are NOT here; they come from Secret Manager (pinned to version 1).
# Deploy command:
#   gcloud run deploy yaw-ledger-api --image=africa-south1-docker.pkg.dev/yaw-network-prod/yaw/ledger-api:<tag> \
#     --region=africa-south1 --service-account=yaw-ledger-api@yaw-network-prod.iam.gserviceaccount.com \
#     --allow-unauthenticated --min-instances=0 --max-instances=3 --memory=512Mi --cpu=1 --concurrency=40 --timeout=60 \
#     --set-secrets=OPERATOR_PRIVATE_KEY=operator-private-key:1,PRODUCER_TOKEN=producer-token:1 \
#     --env-vars-file=deploy/staging.env.yaml --project=yaw-network-prod
NODE_ENV: "production"
LOG_LEVEL: "info"
CHAIN_ID: "yaw-staging-1"
COLLECTION_PREFIX: "stg2_"
INSTANT_BLOCKS: "true"
GENESIS_ALLOCATIONS: '{"yaw5b09df50850fe9fb337adb4921d2841d42f01456":1000000000}'
