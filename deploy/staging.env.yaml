# Environment for the STAGING deployment (separate chain, separate Firestore collections).
# The genesis account below is a throwaway test wallet. Its tokens have no value.
# The real chain (yaw-testnet-1) gets its own genesis, which is a product decision, not made yet.
# Secrets (OPERATOR_PRIVATE_KEY, PRODUCER_TOKEN) are NOT here; they come from Secret Manager.
NODE_ENV: "production"
LOG_LEVEL: "info"
CHAIN_ID: "yaw-staging-1"
COLLECTION_PREFIX: "staging_"
INSTANT_BLOCKS: "true"
GENESIS_ALLOCATIONS: '{"yaw263990a0846db717d87a193a0ef8dfe85d1f68c5":1000000000}'
